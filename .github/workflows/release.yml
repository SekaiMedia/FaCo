name: Veröffentlichen

# Ein Tag wie v0.1.0-beta.1 erzeugt eine Vorabversion, v0.1.0 ein Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Version im Manifest prüfen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python -c "import json;print(json.load(open('custom_components/facade_conductor/manifest.json'))['version'])")
          test "$tag" = "$manifest" || { echo "Tag $tag passt nicht zu manifest.json $manifest"; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
